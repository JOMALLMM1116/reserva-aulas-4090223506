name: HTML Validator

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-html:
    name: Validar HTML
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Validar archivos HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          css: false
          extra: --also-check-css

      - name: Resultado
        if: success()
        run: echo "✅ El HTML es válido. ¡Todo en orden!"